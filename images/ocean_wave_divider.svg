<svg viewBox="0 0 1200 60" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#00c6ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0072ff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="subWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a192f" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0" />
    </linearGradient>
    <filter id="waveGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Ocean Baseline -->
  <line x1="100" y1="30" x2="1100" y2="30" stroke="url(#subWave)" stroke-width="6" />

  <!-- Smooth Sine Waves -->
  <path d="M 50 30 Q 150 10, 250 30 T 450 30 T 650 30 T 850 30 T 1050 30 T 1150 30" 
        fill="none" stroke="url(#waveGrad)" stroke-width="2.5" filter="url(#waveGlow)" />
  <path d="M 50 30 Q 150 48, 250 30 T 450 30 T 650 30 T 850 30 T 1050 30 T 1150 30" 
        fill="none" stroke="url(#waveGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Center Ocean Pulse Node -->
  <circle cx="600" cy="30" r="4" fill="#00f2fe" filter="url(#waveGlow)" />
  <circle cx="600" cy="30" r="10" fill="none" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
</svg>
