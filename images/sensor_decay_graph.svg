<svg viewBox="0 0 1000 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="scopeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030813" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Metal Wave Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Oscilloscope Screen Frame -->
  <rect width="1000" height="360" rx="16" fill="url(#scopeBg)" stroke="#00d2d3" stroke-width="1.5" />

  <!-- Oscilloscope Grid Lines -->
  <g stroke="#00f2fe" stroke-opacity="0.07" stroke-width="1">
    <line x1="50" y1="50" x2="950" y2="50" />
    <line x1="50" y1="100" x2="950" y2="100" />
    <line x1="50" y1="150" x2="950" y2="150" />
    <line x1="50" y1="200" x2="950" y2="200" />
    <line x1="50" y1="250" x2="950" y2="250" />
    <line x1="50" y1="300" x2="950" y2="300" />

    <line x1="120" y1="30" x2="120" y2="320" />
    <line x1="220" y1="30" x2="220" y2="320" />
    <line x1="320" y1="30" x2="320" y2="320" />
    <line x1="420" y1="30" x2="420" y2="320" />
    <line x1="520" y1="30" x2="520" y2="320" />
    <line x1="620" y1="30" x2="620" y2="320" />
    <line x1="720" y1="30" x2="720" y2="320" />
    <line x1="820" y1="30" x2="820" y2="320" />
    <line x1="920" y1="30" x2="920" y2="320" />
  </g>

  <!-- Zero Axis Line -->
  <line x1="50" y1="240" x2="950" y2="240" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="960" y="244" font-family="'Segoe UI', Roboto, monospace" font-size="11" fill="#64748b">0V</text>

  <!-- Title Pill -->
  <g transform="translate(50, 20)">
    <rect width="450" height="28" rx="6" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3" />
    <text x="14" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#00f2fe" letter-spacing="0.5">
      OSCILLOGRAM: PULSE INDUCTION EDDY DECAY &amp; FILTER WINDOWS
    </text>
  </g>

  <!-- Waveform: Primary Excitation Pulse (0-150px) -->
  <path d="M 60 240 L 90 240 L 90 60 L 190 60 L 190 240" fill="none" stroke="#ff9f43" stroke-width="2.5" />
  <text x="140" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff9f43" text-anchor="middle">
    Tx PULSE (200 µs)
  </text>

  <!-- Clamped Flyback Spike -->
  <path d="M 190 240 L 205 320 L 215 90 L 230 240" fill="none" stroke="#ff4757" stroke-width="2" />
  <text x="215" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ff6b81" text-anchor="middle">
    BACK-EMF SPIKE
  </text>

  <!-- Waveform 1: Saltwater / Silt Background Fast Decay (Red/Orange curve) -->
  <path d="M 230 110 Q 250 220, 290 238 L 940 240" fill="none" stroke="#ff4757" stroke-width="2.5" filter="url(#neonRed)" />
  <text x="320" y="220" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff6b81">
    Saltwater &amp; Pelagic Silt: &tau; &lt; 15 &mu;s (Rapid Dissipation)
  </text>

  <!-- Waveform 2: Polymetallic Nodule Eddy Decay (Cyan glowing curve) -->
  <path d="M 230 110 Q 300 130, 420 160 T 650 210 T 920 238" fill="none" stroke="url(#metalGrad)" stroke-width="3.5" filter="url(#neonCyan)" />
  <text x="560" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#00f2fe">
    ⚡ Polymetallic Nodule Target: &tau; &gt; 50 &mu;s (Sustained Decay)
  </text>

  <!-- Gate 1 Sampling Window (Early: 15-25 us) -->
  <rect x="250" y="45" width="45" height="260" fill="#ff4757" fill-opacity="0.12" stroke="#ff4757" stroke-dasharray="3,3" stroke-width="1.5" />
  <text x="272" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#ff6b81" text-anchor="middle">
    GATE 1 (Early)
  </text>
  <text x="272" y="338" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
    Noise Ref
  </text>

  <!-- Gate 2 Sampling Window (Late: 45-75 us) -->
  <rect x="360" y="45" width="90" height="260" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-dasharray="3,3" stroke-width="1.5" />
  <text x="405" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#00f2fe" text-anchor="middle">
    GATE 2 (Late Sample)
  </text>
  <text x="405" y="338" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7bed9f" text-anchor="middle">
    Metallic Integration Zone
  </text>

  <!-- Decision Output Box on Top Right -->
  <g transform="translate(680, 50)">
    <rect width="260" height="75" rx="8" fill="#0f2b48" stroke="#00f2fe" stroke-width="1" />
    <text x="14" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">DIFFERENTIAL DSP OUTPUT</text>
    <text x="14" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#2ed573">ΔS = S_Late - (K · S_Early)</text>
    <text x="14" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#00d2d3">✓ 100% Salinity Rejection Triggered</text>
  </g>
</svg>
