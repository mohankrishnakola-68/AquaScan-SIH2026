  </text>
  <rect x="40" y="118" width="800" height="22" rx="6" fill="#1e293b" />
  <rect x="40" y="118" width="750" height="22" rx="6" fill="url(#redBar)" />
  <text x="800" y="134" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff6b81">PRICED OUT</text>

  <!-- Bar 2: AquaScan Target -->
  <text x="40" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#7bed9f">
