  </text>
  <text x="210" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#2ed573">
    &lt; ₹15,000 INR
  </text>
  <rect x="40" y="182" width="800" height="22" rx="6" fill="#1e293b" />
  <rect x="40" y="182" width="120" height="22" rx="6" fill="url(#greenBar)" filter="url(#glow)" />
  <text x="175" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#2ed573">
