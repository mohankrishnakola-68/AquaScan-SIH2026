<svg viewBox="0 0 1000 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bathyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#0066cc" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#002b5c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#011226" />
    </linearGradient>

    <linearGradient id="sandBed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a2792f" />
      <stop offset="100%" stop-color="#543d18" />
    </linearGradient>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>

  <!-- Water Column Container -->
  <rect width="1000" height="320" rx="16" fill="url(#bathyBg)" stroke="#00f2fe" stroke-width="1.5" />

  <!-- Seabed / Sediment Floor -->
  <path d="M 0 250 Q 250 240, 500 255 T 1000 245 L 1000 320 L 0 320 Z" fill="url(#sandBed)" />
  <text x="500" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#f5cd79" text-anchor="middle" letter-spacing="1">
    SEABED SEDIMENT &amp; SILT LAYER (PENETRATED BY AQUASCAN PULSE INDUCTION UP TO 50 CM)
  </text>

  <!-- Surface Level Line (0m) -->
  <line x1="30" y1="45" x2="970" y2="45" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="60" cy="45" r="5" fill="#ffffff" />
  <text x="80" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff">
    0.0m — OCEAN SURFACE PLANE
  </text>
  <text x="450" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#7bed9f">
    [GNSS SATELLITE FIX &amp; LoRa RF BURST UPLINK]
  </text>

  <!-- Shallow Band Bracket (0 - 10m) -->
  <rect x="30" y="55" width="940" height="185" fill="#00f2fe" fill-opacity="0.05" stroke="#00f2fe" stroke-dasharray="4,4" stroke-width="1" />

  <!-- AquaScan AUV Operating Zone Indicator -->
  <g transform="translate(60, 90)">
    <rect width="320" height="110" rx="10" fill="#0a1e3f" fill-opacity="0.85" stroke="#00f2fe" stroke-width="1.5" />
    <text x="16" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#00f2fe">
      ⚡ AQUASCAN OPERATIONAL ZONE
    </text>
    <text x="16" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      Seafloor Deployment &amp; Sub-Bed Scan
    </text>
    <text x="16" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
      • Near-Bed Inductive &amp; SP Scanning
    </text>
    <text x="16" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
      • Automatic Ballast Release &amp; Ascent
    </text>
  </g>

  <!-- The Deep-Sea Exploration Gap (Center) -->
  <g transform="translate(420, 90)">
    <rect width="280" height="110" rx="10" fill="#1e272e" fill-opacity="0.85" stroke="#ff4757" stroke-width="1.5" />
    <text x="16" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ff4757">
      ⚠️ DEEP-SEA EXPLORATION GAP
    </text>
    <text x="16" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
      • Sonar blind to sub-bed metal grades
    </text>
    <text x="16" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
      • Commercial ROV day rates > ₹35 Lakhs
    </text>
    <text x="16" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffa502">
      • Buried polymetallic nodules &amp; SMS
    </text>
  </g>

  <!-- Commercial AUV Comparison (Right) -->
  <g transform="translate(730, 90)">
    <rect width="230" height="110" rx="10" fill="#1e272e" fill-opacity="0.85" stroke="#747d8c" stroke-width="1" />
    <text x="16" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#a4b0be">
      COMMERCIAL AUVs
    </text>
    <text x="16" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#747d8c">
      (REMUS / Bluefin / Hydroid)
    </text>
    <text x="16" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ff6b81">
      ❌ Cannot enter &lt; 10m zone
    </text>
    <text x="16" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ff6b81">
      ❌ Grounding &amp; crash risk
    </text>
  </g>

  <!-- 10m Depth Marker -->
  <line x1="30" y1="240" x2="970" y2="240" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="30" y="234" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#00f2fe">
    ▼ 10.0m DEPTH RATING
  </text>
</svg>
